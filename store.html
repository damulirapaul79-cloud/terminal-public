<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paul's Terminal Store - Jumia Style</title>
<style>
body{margin:0;font-family:sans-serif;background:#f5f5f5}
.header{background:#f68b1e;padding:15px;color:white;display:flex;justify-content:space-between;align-items:center}
.header input{width:60%;padding:10px;border-radius:5px;border:none}
.cart{background:white;color:#f68b1e;padding:8px 15px;border-radius:5px;font-weight:bold}
.products{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:white;border-radius:8px;padding:10px;text-align:center}
.card img{width:100%;border-radius:8px;height:120px;object-fit:cover}
.card button{background:#f68b1e;color:white;border:none;padding:10px;width:100%;border-radius:5px;margin-top:5px;font-weight:bold}
</style>
</head>
<body>
<div class="header">
  <b>TERMINAL STORE</b>
  <input type="text" id="search" placeholder="Search products..." onkeyup="searchProducts()">
  <div class="cart" onclick="checkout()">Cart (<span id="count">0</span>)</div>
</div>

<div class="products" id="products">
  <div class="card">
    <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500">
    <p>Smartphone - 450,000 UGX</p>
    <button onclick="addToCart('Smartphone 450k')">Add to Cart</button>
  </div>
  <div class="card">
    <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500">
    <p>Sneakers - 80,000 UGX</p>
    <button onclick="addToCart('Sneakers 80k')">Add to Cart</button>
  </div>
  <div class="card">
    <img src="https://images.unsplash.com/photo-1603133879798-ff0d2a1b03c7?w=500">
    <p>Pilau Pack - 15,000 UGX</p>
    <button onclick="addToCart('Pilau 15k')">Add to Cart</button>
  </div>
  <div class="card">
    <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500">
    <p>Watch - 120,000 UGX</p>
    <button onclick="addToCart('Watch 120k')">Add to Cart</button>
  </div>
</div>

<script>
let cart = [];
function addToCart(item){
  cart.push(item);
  document.getElementById('count').innerText = cart.length;
  alert(item + ' added! Cart: ' + cart.length);
}
function searchProducts(){
  let q = document.getElementById('search').value.toLowerCase();
  let cards = document.querySelectorAll('.card');
  cards.forEach(c => {
    c.style.display = c.innerText.toLowerCase().includes(q) ? 'block' : 'none';
  });
}
function checkout(){
  if(cart.length==0){alert('Cart empty!');return;}
  let text = 'Hello Paul! I want to order: ' + cart.join(', ');
  window.open('https://wa.me/256708598666?text=' + encodeURIComponent(text));
}
</script>
</body>
</html>
